name: brand-daily-story
on:
  schedule:
    - cron: "0 23 * * *"   # 06:00 giờ VN mỗi ngày (GitHub chạy theo UTC)
  workflow_dispatch:       # nút chạy tay: tab Actions -> Run workflow

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # để bot commit file state.json lại
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gửi câu chuyện brand
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python brand_story_bot.py

      - name: Lưu lịch sử đã gửi (tránh gửi trùng)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
